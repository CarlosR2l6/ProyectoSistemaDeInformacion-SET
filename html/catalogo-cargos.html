<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargos | SET</title>
  <link rel="stylesheet" href="../css/colores.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body data-seccion="Catálogos" data-pagina="Cargos" data-migas="Inicio|Catálogos|Cargos">

  <!--Barra superior y submenú: los rellena js/menu.js-->
  <header class="barra-superior" id="barra-superior"></header>
  <nav class="submenu" id="submenu" aria-label="Submenú"></nav>
  <div class="migas" id="migas" aria-label="Ruta de navegación"></div>

  <!--Contenido de la pagina-->
  <main class="contenido">
    <h1>Cargos</h1>
    <p class="subtitulo">Catálogo de apoyo: sus datos aparecen en las listas desplegables de todo el sistema.</p>

    <!--Formulario-->
    <!--novalidate: la validación la hace js/app.js, para mostrar los errores junto a cada campo.
    data-mensaje-ok: texto del aviso al guardar-->
    <form id="formulario" class="formulario" novalidate data-mensaje-ok="Guardado correctamente">
    <section class="tarjeta">
        <h2 class="tarjeta__titulo">Nuevo registro</h2>
        <div class="rejilla rejilla--2">

          <!--Campo: Nombre del cargo-->
          <div class="campo">
                <label for="nombre">Nombre del cargo <span class="obligatorio" title="Campo obligatorio">*</span></label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Conductor" required>
                <p class="campo__error" hidden></p>
            </div>

           <!--Campo: Descripción-->
           <div class="campo">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion" placeholder="Funciones principales">
                <p class="campo__error" hidden></p>
            </div>
        </div>

        <!--Boton-->
        <!--Guardar = azul, Cancelar = gris (colores fijos por acción)-->
        <div class="botones">
            <button type="submit" class="boton boton--guardar">Guardar</button>
            <button type="reset" class="boton boton--secundario">Cancelar</button>
        </div>
    </section>
    </form>

    <!--Barra de herramientas-->
    <!--data-tabla: id de la tabla que controla. Editar y Eliminar empiezan desactivados
    (disabled) y js/app.js los activa al seleccionar una fila-->
    <div class="herramientas" data-tabla="tabla-cargos">
        <input type="search" class="buscador" placeholder="Buscar…" aria-label="Buscar en la tabla">
        <span class="herramientas__espacio"></span>
        <button type="button" class="boton boton--secundario" data-accion="exportar">⬇ Exportar a Excel</button>
        <button type="button" class="boton boton--contorno" data-accion="editar" disabled>✎ Editar</button>
        <button type="button" class="boton boton--eliminar" data-accion="eliminar" disabled>🗑 Eliminar</button>
        <a class="boton boton--agregar" href="#formulario">＋ Agregar</a>
    </div>

    <!--Tabla-->
    <!--Cada fila (tr) lleva data-id (número en la base de datos) y data-nombre
    (el nombre que se muestra al pedir confirmación de eliminar)-->
    <div class="tabla-contenedor">
        <table class="tabla" id="tabla-cargos" data-nombre-archivo="cargos">
            <thead>
             <tr>
                <th class="ordenable" data-campo="nombre">Nombre</th>
                <th class="ordenable" data-campo="descripcion">Descripción</th>
             </tr>
            </thead>
            <tbody>
                <tr data-id="1" data-nombre="Conductor"><td>Conductor</td><td>Transporta pasajeros en las rutas asignadas</td></tr>
                <tr data-id="2" data-nombre="Coordinador"><td>Coordinador</td><td>Gestiona rutas y novedades</td></tr>
            </tbody>
      </table>

      <!--Heuristica 10: estado vacío, se muestra solo si no hay filas visibles-->
      <div class="vacio" data-vacio="tabla-cargos" hidden>Aún no hay registros. Agrega el primero con el formulario de arriba.</div>
    </div>
    <p class="contador" data-contador="tabla-cargos"></p>
  </main>

  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
