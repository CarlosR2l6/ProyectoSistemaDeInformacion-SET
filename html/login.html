<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | SET</title>
    <link rel="stylesheet" href="../css/colores.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="pagina-login">
    <main class="login">
         <img src="../imagen/Logo_Trnaspote_Especiales_SET.png" alt="Transportes Especiales SET S.A.S.">
        <h1>Bienvenido</h1>
        <p class="subtitulo">Ingresa con tu usuario para continuar</p>
        <form id="form-login" method="post" novalidate>

            <!-- Campo: usuario -->
            <div class="campo">
                <label for="usuario">Usuario<span class="obligatorio">*</span></label>
                <input type="text" id="usuario" name="usuario" placeholder="jperez" autocomplete="username" required>
            </div>

            <!--Campo: contraseña-->
            <div class="campo">
                <label for="clave">Contraseña<span class="obligatorio">*</span></label>
                <input type="password" id="clave" name="clave" autocomplete="current-password" required>
            </div>


            <!--Heurística 3:Control y libertad del usuario,
            poder ver la contraseña ayuda a corregir errores al escribir-->
            <label class="casilla"><input type="checkbox" id="ver-clave" aria-controls="clave"> Mostrar contraseña</label>
            <button type="submit" class="boton">Iniciar sesión</button>
            
            <!--Heurística 9: Ayudar a los usuarios a reconocer, diagnosticar y corregir errores,
            mensaje claro cuando algo sale mal. Esta oculto(hidden) hasta que el ingreso falla-->
            <p class="campo__error" id="login-error" role="alert" hidden>
                Usuario o contraseña incorrectos. Verifica e intenta de nuevo.
            </p>
            <button type="button" class="login__enlace" data-accion="recuperar">¿Olvidaste tu contraseña?</button>
        </form>
    </main>
    <script src="../js/app.js"></script>
</body>
</html>
