<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contratos | SET</title>
  <link rel="stylesheet" href="../css/colores.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body data-seccion="Operación" data-pagina="Contratos" data-migas="Inicio|Operación|Contratos">

  <!-- Barra superior y submenú: los rellena js/menu.js -->
  <header class="barra-superior" id="barra-superior"></header>
  <nav class="submenu" id="submenu" aria-label="Submenú"></nav>
  <div class="migas" id="migas" aria-label="Ruta de navegación"></div>

  <!--Contenido de la pagina-->
  <main class="contenido">
    <h1>Contratos</h1>
    <p class="subtitulo">Contratos con clientes y empresas prestadoras del servicio.</p>

    <!--Formulario-->
    <!--novalidate: la validación la hace js/app.js, para mostrar los errores junto a cada campo.
    data-mensaje-ok: texto del aviso al guardar-->
    <form id="formulario" class="formulario" novalidate data-mensaje-ok="Contrato guardado correctamente">
    <section class="tarjeta">
      <h2 class="tarjeta__titulo">Nuevo contrato</h2>
      <div class="rejilla rejilla--3">

        <!--Campo: Número de contrato-->
        <div class="campo">
          <label for="numero">Número de contrato <span class="obligatorio" title="Campo obligatorio">*</span></label>
          <input type="text" id="numero" name="numero" placeholder="Ej: CT-2026-001" required>
          <p class="campo__error" hidden></p>
        </div>

        <!--Campo: Cliente-->
        <div class="campo">
          <label for="cliente">Cliente <span class="obligatorio" title="Campo obligatorio">*</span></label>
          <input type="search" id="cliente" name="cliente" list="lista-cliente" placeholder="Escribe para buscar…" autocomplete="off" required>
          <datalist id="lista-cliente"><option value="Cliente S.A."><option value="Industrias Andes"><option value="Colegio San José"></datalist>
          <p class="campo__error" hidden></p>
        </div>

        <!--Campo: Empresa prestadora-->
        <div class="campo">
          <label for="empresa">Empresa prestadora <span class="obligatorio" title="Campo obligatorio">*</span></label>
          <select id="empresa" name="empresa" required><option value="">Seleccionar…</option><option value="Empresa X">Empresa X</option><option value="Servicios Y">Servicios Y</option></select>
          <p class="campo__error" hidden></p>
        </div>

        <!--Campo: Fecha de inicio-->
        <div class="campo">
          <label for="inicio">Fecha de inicio <span class="obligatorio" title="Campo obligatorio">*</span></label>
          <input type="date" id="inicio" name="inicio" placeholder="" required>
          <p class="campo__error" hidden></p>
        </div>

        <!--Campo: Fecha fin-->
        <div class="campo">
          <label for="fin">Fecha fin <span class="obligatorio" title="Campo obligatorio">*</span></label>
          <input type="date" id="fin" name="fin" placeholder="" data-despues-de="inicio" required>
          <p class="campo__error" hidden></p>
        </div>

        <!--Campo: Estado-->
        <div class="campo">
          <label for="estado">Estado <span class="obligatorio" title="Campo obligatorio">*</span></label>
          <select id="estado" name="estado" required><option value="">Seleccionar…</option><option value="Vigente">Vigente</option><option value="Vencido">Vencido</option></select>
          <p class="campo__error" hidden></p>
        </div>

        <!--Campo: Observaciones-->
        <div class="campo">
          <label for="observaciones">Observaciones</label>
          <input type="text" id="observaciones" name="observaciones" placeholder="Opcional">
          <p class="campo__error" hidden></p>
        </div>
      </div>

      <!--Boton-->
      <!--Guardar = azul, Cancelar = gris (colores fijos por acción)-->
      <div class="botones">
        <button type="submit" class="boton boton--guardar">Guardar contrato</button>
        <button type="reset" class="boton boton--secundario">Cancelar</button>
      </div>
    </section>
    </form>

    <!--Barra de heramientas-->
    <!--data-tabla: id de la tabla que controla. Editar y Eliminar empiezan desactivados
    (disabled) y js/app.js los activa al seleccionar una fila-->
    <div class="herramientas" data-tabla="tabla-contratos">
      <input type="search" class="buscador" placeholder="Buscar contrato…" aria-label="Buscar en la tabla">
      <select class="filtro" aria-label="Filtrar por estado">
        <option value="">Todos los estados</option><option value="Vigente">Vigente</option><option value="Vencido">Vencido</option>
      </select>
      <span class="herramientas__espacio"></span>
      <button type="button" class="boton boton--secundario" data-accion="exportar">⬇ Exportar a Excel</button>
      <button type="button" class="boton boton--contorno" data-accion="editar" disabled>✎ Editar</button>
      <button type="button" class="boton boton--eliminar" data-accion="eliminar" disabled>🗑 Eliminar</button>
      <a class="boton boton--agregar" href="#formulario">＋ Agregar</a>
    </div>

    <!--Tabla-->
    <!--Cada fila (tr) lleva data-id (número en la base de datos) y data-nombre
    (el nombre que se muestra al pedir confirmación de eliminar)-->
    <div class="tabla-contenedor">
      <table class="tabla" id="tabla-contratos" data-nombre-archivo="contratos">
        <thead>
          <tr>
            <th class="ordenable" data-campo="numero">N.º contrato</th>
            <th class="ordenable" data-campo="cliente">Cliente</th>
            <th class="ordenable" data-campo="empresa">Empresa prestadora</th>
            <th class="ordenable" data-campo="inicio">Inicio</th>
            <th class="ordenable" data-campo="fin">Fin</th>
            <th class="ordenable" data-campo="observaciones">Observaciones</th>
            <th class="ordenable" data-campo="estado">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr data-id="1" data-nombre="Contrato CT-2026-001"><td>CT-2026-001</td><td>Cliente S.A.</td><td>Empresa X</td><td data-valor="2026-01-01">01/01/2026</td><td data-valor="2026-12-31">31/12/2026</td><td>—</td><td data-valor="Vigente"><span class="estado estado--ok" data-estado="Vigente">✔ Vigente</span></td></tr>
        </tbody>
      </table>

      <!--Heuristica 10: estado vacío, se muestra solo si no hay filas visibles-->
      <div class="vacio" data-vacio="tabla-contratos" hidden>Aún no hay contratos.</div>
    </div>
    <p class="contador" data-contador="tabla-contratos"></p>
  </main>

  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
